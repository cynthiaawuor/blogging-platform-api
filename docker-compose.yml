services:
  db:
    image: postgres:18.3
    container_name: blog_postgres_db
    restart: always
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: blog
    ports:
      - "5432:5432" # Allows host access via localhost:5432 (host port):(container port)
    volumes:
      - postgres_data:/var/lib/postgresql/data #allow data backup even if the container is closed.

volumes:
  postgres_data:
